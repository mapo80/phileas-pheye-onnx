name: consumer-verify

# Proves the PUBLISHED artifact is consumable from GitHub Packages by an independent project.
#
# The workflow's built-in GITHUB_TOKEN carries `packages: read`, which is exactly the scope a
# personal access token needs for maven.pkg.github.com. Verifying here therefore closes the
# Packages-consumption check without anyone having to mint a PAT.
#
# Three properties make the result meaningful:
#   - the dependency is declared only against maven.pkg.github.com
#   - the build uses an EMPTY temporary local repository, so no prior `mvn install` can satisfy it
#   - the tests run behind an unroutable HTTP proxy, so inference cannot reach the network
on:
  push:
    branches: [ 'main' ]
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to verify (e.g. 1.2.0)'
        required: false

permissions:
  contents: read
  packages: read

jobs:
  consume:
    name: Resolve from GitHub Packages and run local ONNX inference
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to discover the latest published version. The default shallow,
          # --no-tags checkout makes `git describe` find nothing, which previously let this job
          # report success while verifying nothing at all.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Resolve the version to verify
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # On a branch push, verify the most recent published release tag.
            version="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' || true)"
          fi
          if [ -z "${version}" ]; then
            # Failing here is deliberate. A job that reports success without resolving anything is
            # worse than a red build: it looks like the distribution was verified when it was not.
            echo "::error::could not resolve a published version to verify (no v* tag found)"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Verifying ${version}"

      - name: Wait for the package to be visible
        run: |
          set -euo pipefail
          base="https://maven.pkg.github.com/mapo80/phileas-pheye-onnx/io/github/mapo80/phileas-pheye-onnx/${{ steps.version.outputs.version }}"
          pom="${base}/phileas-pheye-onnx-${{ steps.version.outputs.version }}.pom"
          # A release publishes the package moments before this job starts; give it a short grace
          # period rather than failing on a race.
          for attempt in 1 2 3 4 5 6; do
            # -L matters: GitHub Packages answers 302 with a redirect to a signed URL, so a probe
            # that does not follow redirects reads a present package as absent.
            code=$(curl -sL -o /dev/null -w '%{http_code}' -u "x-access-token:${{ secrets.GITHUB_TOKEN }}" "${pom}")
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::the package is not readable from GitHub Packages"
          exit 1

      - name: Download a GLiNER model
        run: |
          set -euo pipefail
          # universal_ner_ita INT8 is the smallest published GLiNER export that handles Italian
          # (119 MB), which keeps this job quick while still exercising real inference.
          repo="onnx-community/universal_ner_ita"
          dir="${RUNNER_TEMP}/model"
          mkdir -p "${dir}/onnx"
          for f in tokenizer.json gliner_config.json; do
            curl -fsSL "https://huggingface.co/${repo}/resolve/main/${f}" -o "${dir}/${f}"
          done
          curl -fsSL "https://huggingface.co/${repo}/resolve/main/onnx/model_int8.onnx" \
            -o "${dir}/onnx/model.onnx"
          ls -lh "${dir}" "${dir}/onnx"
          echo "CONSUMER_MODEL_DIR=${dir}" >> "$GITHUB_ENV"

      - name: Consume from GitHub Packages into an empty repository
        working-directory: examples/consumer-verification
        run: |
          set -euo pipefail
          repo="$(mktemp -d)"
          cat > settings.xml <<XML
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>x-access-token</username>
                <password>\${env.PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML

          echo "empty local repository: ${repo}"
          mvn --batch-mode --no-transfer-progress \
              -s settings.xml \
              -Dmaven.repo.local="${repo}" \
              -Dpheye.onnx.version=${{ steps.version.outputs.version }} \
              -DargLine="--enable-native-access=ALL-UNNAMED -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=9 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=9 -Dai.djl.offline=true" \
              test

          echo
          echo "Artifacts actually downloaded from GitHub Packages:"
          find "${repo}/io/github/mapo80" -type f \( -name '*.jar' -o -name '*.pom' \) \
            | sed "s|${repo}/|  |"
        env:
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
