name: release

# Triggered by a vX.Y.Z tag. Builds on Java 21, publishes to GitHub Packages so the artifact can be
# consumed as an ordinary Maven dependency, and creates a GitHub Release with the JARs plus SHA256
# sums for direct download.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.2.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          # Wires a 'github' server into ~/.m2/settings.xml matching the pom's
          # distributionManagement id, authenticated with the workflow token.
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Resolve the release version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}"

      - name: Set the POM version
        run: mvn --batch-mode --no-transfer-progress versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Build, test and verify
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Enforce Java 21 bytecode
        run: |
          set -euo pipefail
          while read -r class; do
            major=$(javap -verbose -cp target/classes "${class}" | awk '/major version/ {print $3; exit}')
            if [ "${major}" -gt 65 ]; then
              echo "::error::${class} is class-file major ${major}; Java 21 supports at most 65"
              exit 1
            fi
          done < <(find target/classes -name '*.class' | sed 's|target/classes/||; s|\.class$||; s|/|.|g')
          echo "All classes are Java 21 compatible."

      - name: Publish to GitHub Packages
        run: mvn --batch-mode --no-transfer-progress -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # A credential-free channel, in addition to GitHub Packages.
      # GitHub Packages requires authentication for Maven even for a public package, and offers no
      # setting to allow anonymous reads, so a consumer without a token cannot use it. The same
      # artifacts are therefore also published as a plain Maven repository layout on the maven-repo
      # branch, which raw.githubusercontent.com serves anonymously for a public repository.
      - name: Publish to the credential-free Maven repository branch
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          stage="$(mktemp -d)"
          mvn --batch-mode --no-transfer-progress -DskipTests \
              deploy -DaltDeploymentRepository="local::file://${stage}"

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin maven-repo --depth=1 || true
          worktree="$(mktemp -d)/maven-repo"
          if git show-ref --verify --quiet refs/remotes/origin/maven-repo; then
            git worktree add "${worktree}" origin/maven-repo
            git -C "${worktree}" checkout -B maven-repo
          else
            git worktree add --detach "${worktree}"
            git -C "${worktree}" checkout --orphan maven-repo
            git -C "${worktree}" rm -rq --cached . 2>/dev/null || true
            find "${worktree}" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

          # Merge, never replace: earlier versions must remain resolvable.
          cp -R "${stage}/io" "${worktree}/"

          git -C "${worktree}" add -A
          if git -C "${worktree}" diff --cached --quiet; then
            echo "nothing new to publish"
          else
            git -C "${worktree}" commit -m "Maven repository for anonymous consumption: ${version}"
            git -C "${worktree}" push origin maven-repo
          fi

      - name: Verify anonymous resolution
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          base="https://raw.githubusercontent.com/mapo80/phileas-pheye-onnx/maven-repo/io/github/mapo80/phileas-pheye-onnx/${version}"
          for f in "phileas-pheye-onnx-${version}.pom" "phileas-pheye-onnx-${version}.jar"; do
            # No Authorization header on purpose: this step exists to prove no token is needed.
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' "${base}/${f}")
              [ "${code}" = "200" ] && break
              sleep 10
            done
            echo "${f}: HTTP ${code}"
            [ "${code}" = "200" ] || { echo "::error::${f} is not anonymously readable"; exit 1; }
          done

      - name: Checksums
        run: |
          cd target
          for jar in *.jar; do
            sha256sum "${jar}" > "${jar}.sha256"
          done
          cat *.sha256

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          generate_release_notes: true
          files: |
            target/*.jar
            target/*.jar.sha256
