name: build

# Every push and PR must prove three things: it compiles on Java 21, its tests pass on Java 21,
# and the bytecode it produces is actually loadable by a Java 21 JVM. The last one is the point of
# the class-file check below: a stray <release> bump would otherwise sail through a Java 21 build
# and only fail for consumers.
on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify the toolchain really is Java 21
        run: |
          java -version
          test "$(java -version 2>&1 | head -1 | sed -E 's/.*"(2[0-9])\..*/\1/')" = "21"

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      # A class file newer than major 65 cannot be loaded by a Java 21 JVM. Fail the build rather
      # than publish an artifact our consumers cannot run.
      - name: Enforce Java 21 bytecode (class-file major version <= 65)
        run: |
          set -euo pipefail
          bad=0
          while read -r class; do
            major=$(javap -verbose -cp target/classes "${class}" | awk '/major version/ {print $3; exit}')
            if [ "${major}" -gt 65 ]; then
              echo "::error::${class} is class-file major ${major}; Java 21 supports at most 65"
              bad=1
            fi
          done < <(find target/classes -name '*.class' | sed 's|target/classes/||; s|\.class$||; s|/|.|g')
          if [ "${bad}" -ne 0 ]; then
            exit 1
          fi
          echo "All classes are Java 21 compatible (major <= 65)."

      - name: Upload the JAR
        uses: actions/upload-artifact@v4
        with:
          name: phileas-pheye-onnx-jar
          path: |
            target/*.jar
          if-no-files-found: error
